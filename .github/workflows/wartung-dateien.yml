name: Wartung – Dateien und Notizen aufräumen

# Einmalige Wartungsläufe, Details im jeweiligen Skript:
#   dateien  scripts/wartung-dateien.mjs  (nach der Upload-Sperre, 0052)
#   notizen  scripts/wartung-notizen.mjs  (ein Notiz-System, 0055)
# Nur von Hand startbar; zuerst mit "probe" laufen lassen und die Ausgabe
# prüfen, dann mit "ausfuehren".
#
# Das Repository ist öffentlich: Protokolle UND Artefakte kann jeder
# angemeldete GitHub-Nutzer lesen. Die Skripte schreiben deshalb keine
# Inhalte ins Protokoll, und die Sicherung des Gelöschten geht nur
# verschlüsselt (Secret BACKUP_PASSWORT, wie beim Backup) als Artefakt raus.
# Ohne das Secret bricht "ausfuehren" ab, bevor etwas gelöscht wird.
#
# Den Service-Role-Schlüssel holt der Lauf sich über die Management-API mit dem
# vorhandenen Secret SUPABASE_ACCESS_TOKEN - er liegt nirgends gespeichert und
# wird im Protokoll maskiert.

on:
  workflow_dispatch:
    inputs:
      skript:
        description: 'Welche Wartung'
        required: true
        default: notizen
        type: choice
        options: [dateien, notizen]
      modus:
        description: '"probe" zeigt nur den Plan, "ausfuehren" ändert'
        required: true
        default: probe
        type: choice
        options: [probe, ausfuehren]
      auch_von:
        description: 'nur notizen: Namen (kommagetrennt), deren Sitzungs-Notizen nach Vorlage ebenfalls gelöscht werden'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  wartung:
    runs-on: ubuntu-latest
    steps:
      - name: Passwort für die Sicherung vorhanden?
        if: inputs.modus == 'ausfuehren'
        env:
          BACKUP_PW: ${{ secrets.BACKUP_PASSWORT }}
        run: |
          if [ -z "$BACKUP_PW" ]; then
            echo "::error::Secret BACKUP_PASSWORT fehlt - ohne Verschlüsselung landete die Sicherung öffentlich lesbar im Artefakt."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Service-Role-Schlüssel holen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          key=$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true" \
            | jq -r '.[] | select(.name == "service_role") | .api_key')
          if [ -z "$key" ] || [ "$key" = "null" ]; then echo "Kein service_role-Schlüssel erhalten"; exit 1; fi
          echo "::add-mask::$key"
          echo "SUPABASE_SERVICE_ROLE_KEY=$key" >> "$GITHUB_ENV"
      - name: Wartung
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          MODUS: ${{ inputs.modus }}
          AUCH_VON: ${{ inputs.auch_von }}
          EXPORT_DIR: export
        run: node "scripts/wartung-${{ inputs.skript }}.mjs"
      # Sicherung des Gelöschten, verschlüsselt; läuft nach 30 Tagen von selbst
      # ab. Entschlüsseln: gpg --decrypt sicherung.tar.gz.gpg | tar xz
      - name: Sicherung verschlüsseln
        if: inputs.modus == 'ausfuehren'
        env:
          BACKUP_PASSWORT: ${{ secrets.BACKUP_PASSWORT }}
        run: |
          if [ -d export ] && [ -n "$(ls -A export)" ]; then
            tar czf sicherung.tar.gz export
            gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSWORT" \
              --symmetric --cipher-algo AES256 -o sicherung.tar.gz.gpg sicherung.tar.gz
            rm -rf export sicherung.tar.gz
          fi
      - uses: actions/upload-artifact@v4
        if: inputs.modus == 'ausfuehren'
        with:
          name: geloeschte-${{ inputs.skript }}-${{ github.run_number }}
          path: sicherung.tar.gz.gpg
          retention-days: 30
          if-no-files-found: ignore
