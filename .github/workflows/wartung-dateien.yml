name: Wartung – Dateien umziehen und aufräumen

# Einmalige Datei-Wartung nach der Upload-Sperre, Details in
# scripts/wartung-dateien.mjs. Nur von Hand startbar; zuerst mit "probe"
# laufen lassen und die Ausgabe prüfen, dann mit "ausfuehren".
#
# Den Service-Role-Schlüssel holt der Lauf sich über die Management-API mit dem
# vorhandenen Secret SUPABASE_ACCESS_TOKEN - er liegt nirgends gespeichert und
# wird im Protokoll maskiert.

on:
  workflow_dispatch:
    inputs:
      modus:
        description: '"probe" zeigt nur den Plan, "ausfuehren" ändert'
        required: true
        default: probe
        type: choice
        options: [probe, ausfuehren]

permissions:
  contents: read

jobs:
  wartung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Service-Role-Schlüssel holen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          key=$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true" \
            | jq -r '.[] | select(.name == "service_role") | .api_key')
          if [ -z "$key" ] || [ "$key" = "null" ]; then echo "Kein service_role-Schlüssel erhalten"; exit 1; fi
          echo "::add-mask::$key"
          echo "SUPABASE_SERVICE_ROLE_KEY=$key" >> "$GITHUB_ENV"
      - name: Wartung
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          MODUS: ${{ inputs.modus }}
          EXPORT_DIR: export
        run: node scripts/wartung-dateien.mjs
      # Sicherung der gelöschten Dateien, läuft nach 30 Tagen von selbst ab.
      - uses: actions/upload-artifact@v4
        if: inputs.modus == 'ausfuehren'
        with:
          name: geloeschte-dateien
          path: export/
          retention-days: 30
          if-no-files-found: ignore
